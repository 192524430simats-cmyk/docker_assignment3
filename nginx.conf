events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream campus_api { zone campus_api 64k; server api:5000 resolve; }
  server {
    listen 80;
    location / { proxy_pass http://campus_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
